<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renault - Inovação em Movimento</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header class="bg-dark text-white py-3">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div class="logo">
                    <img src="https://static.vecteezy.com/ti/vetor-gratis/p1/20500608-renault-logotipo-marca-simbolo-com-nome-branco-projeto-frances-carro-automovel-ilustracao-com-preto-fundo-gratis-vetor.jpg" alt="Renault Logo" height="50">
                </div>
                <nav>
                    <ul class="list-unstyled d-flex mb-0">
                        <li class="ms-3"><a href="#home" class="text-white text-decoration-none">Home</a></li>
                        <li class="ms-3"><a href="#models" class="text-white text-decoration-none">Modelos</a></li>
                        <li class="ms-3"><a href="#about" class="text-white text-decoration-none">Sobre Nós</a></li>
                        <li class="ms-3"><a href="#contact" class="text-white text-decoration-none">Contato</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- Seção Hero -->
    <section id="home" class="hero bg-primary text-white text-center py-5">
        <div class="container">
            <h1 class="display-4">Bem-vindo à Renault</h1>
            <p class="lead">Descubra a inovação em movimento.</p>
            <a href="#models" class="btn btn-light btn-lg">Ver Modelos</a>
        </div>
    </section>

    <!-- Seção Modelos -->
    <section id="models" class="models py-5 z-index">
        <div class="container">
            <h2 class="text-center mb-5">Nossos Modelos</h2>
            <div class="row">
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <img src="https://production.autoforce.com/uploads/version/profile_image/10668/model_main_webp_comprar-zen_6f8b162f8f.png.webp" class="card-img-top" alt="Kwid">
                        <div class="card-body">
                            <h3 class="card-title text-center">Kwid</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <img src="https://cdn.awsli.com.br/300x300/562/562407/produto/147764763/83bc3a23ff.jpg" class="card-img-top" alt="Logan">
                        <div class="card-body">
                            <h3 class="card-title text-center">Logan</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGrQg_zFHHr7Cn4Ok2Rgnb6oWdfsodWu5uew&s" class="card-img-top" alt="Duster">
                        <div class="card-body">
                            <h3 class="card-title text-center">Duster</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Rodapé -->
    <footer id="contact" class="bg-dark text-white text-center py-4">
        <div class="container">
            <p>&copy; 2023 Renault. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
